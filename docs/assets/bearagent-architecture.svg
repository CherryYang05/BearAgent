<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2400" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">BearAgent P1 runtime architecture</title>
  <desc id="desc">A spacious five-layer overview of BearAgent's implemented P1 architecture: local entry and composition, application orchestration, runtime safety, ports and adapters, and durable facts and outputs.</desc>

  <defs>
    <linearGradient id="brandLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2364aa"/>
      <stop offset="0.52" stop-color="#158373"/>
      <stop offset="1" stop-color="#c9681f"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#20324a" flood-opacity="0.09"/>
    </filter>
    <marker id="downArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#8b98a8"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .header-title { font-size: 34px; font-weight: 760; fill: #18263b; letter-spacing: -0.6px; }
      .header-subtitle { font-size: 16px; font-weight: 500; fill: #68778b; }
      .status { font-size: 14px; font-weight: 720; fill: #9a4d16; }
      .layer-title { font-size: 25px; font-weight: 750; letter-spacing: -0.25px; }
      .layer-subtitle { font-size: 15px; font-weight: 520; fill: #6f7f92; }
      .card-title { font-size: 24px; font-weight: 730; fill: #1d2b40; letter-spacing: -0.2px; }
      .card-body { font-size: 17px; font-weight: 500; fill: #68778b; }
      .chip { font-size: 14px; font-weight: 680; fill: #29534d; }
      .footer { font-size: 16px; font-weight: 560; fill: #66758a; }
      .card { fill: #fff; stroke-width: 1.3; filter: url(#shadow); }
      .icon { fill: none; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
      .connector { fill: none; stroke: #8b98a8; stroke-width: 3; stroke-linecap: round; marker-end: url(#downArrow); }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#f7f9fc"/>

  <!-- Header -->
  <rect x="20" y="20" width="1880" height="80" rx="22" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <rect x="40" y="36" width="7" height="48" rx="3.5" fill="url(#brandLine)"/>
  <text x="68" y="58" class="header-title">BearAgent Runtime Architecture</text>
  <text x="69" y="82" class="header-subtitle">Inspectable, local-first Agent Runtime · current P1 implementation</text>
  <rect x="1572" y="38" width="304" height="43" rx="21.5" fill="#fff7ed" stroke="#efc39f"/>
  <circle cx="1595" cy="59.5" r="6" fill="#c9681f"/>
  <text x="1611" y="64" class="status">IMPLEMENTED ONLY · P2–P4 OMITTED</text>

  <!-- Layer 1: Entry and composition -->
  <g>
    <rect x="20" y="125" width="1880" height="160" rx="24" fill="#eff6ff" stroke="#cadcf3" stroke-width="1.4"/>
    <path d="M 340 125 V 285" stroke="#cadcf3" stroke-width="1.4"/>
    <rect x="20" y="125" width="320" height="160" rx="24" fill="#e7f1ff"/>

    <g class="icon" stroke="#2364aa" transform="translate(48 175)">
      <path d="M 4 32 H 40 M 27 19 L 40 32 L 27 45"/>
      <rect x="48" y="8" width="48" height="50" rx="6"/>
      <path d="M 61 20 L 81 24"/>
    </g>
    <text x="150" y="174" class="layer-title" fill="#2364aa">Entry &amp;</text>
    <text x="150" y="205" class="layer-title" fill="#2364aa">Composition</text>
    <text x="150" y="236" class="layer-subtitle">one local process</text>

    <rect x="365" y="143" width="495" height="124" rx="20" class="card" stroke="#c4d8f1"/>
    <rect x="387" y="166" width="78" height="78" rx="18" fill="#eaf3ff"/>
    <g class="icon" stroke="#2364aa" transform="translate(404 185)">
      <rect x="0" y="4" width="44" height="34" rx="5"/>
      <path d="M 9 14 L 17 21 L 9 28 M 23 29 H 34"/>
    </g>
    <text x="485" y="188" class="card-title">CLI</text>
    <text x="485" y="219" class="card-body">doctor · run · inspect · events</text>

    <rect x="880" y="143" width="495" height="124" rx="20" class="card" stroke="#c4d8f1"/>
    <rect x="902" y="166" width="78" height="78" rx="18" fill="#eaf3ff"/>
    <g class="icon" stroke="#2364aa" transform="translate(921 183)">
      <path d="M 4 2 H 32 L 44 14 V 45 H 4 Z M 32 2 V 14 H 44"/>
      <path d="M 12 25 H 35 M 12 34 H 30"/>
    </g>
    <text x="1000" y="188" class="card-title">Local Configuration</text>
    <text x="1000" y="219" class="card-body">provider · instructions · hard budgets</text>

    <rect x="1395" y="143" width="505" height="124" rx="20" class="card" stroke="#c4d8f1"/>
    <rect x="1417" y="166" width="78" height="78" rx="18" fill="#eaf3ff"/>
    <g class="icon" stroke="#2364aa" transform="translate(1434 182)">
      <circle cx="22" cy="8" r="7"/><circle cx="7" cy="39" r="7"/><circle cx="37" cy="39" r="7"/>
      <path d="M 18 14 L 10 32 M 26 14 L 34 32"/>
    </g>
    <text x="1515" y="188" class="card-title">Composition Root</text>
    <text x="1515" y="219" class="card-body">bootstrap.py wires ports and adapters</text>
  </g>

  <path d="M 960 293 V 316" class="connector"/>

  <!-- Layer 2: Application orchestration -->
  <g>
    <rect x="20" y="325" width="1880" height="160" rx="24" fill="#f5f1ff" stroke="#d9cef3" stroke-width="1.4"/>
    <path d="M 340 325 V 485" stroke="#d9cef3" stroke-width="1.4"/>
    <rect x="20" y="325" width="320" height="160" rx="24" fill="#eee7ff"/>

    <g class="icon" stroke="#6547b6" transform="translate(50 371)">
      <rect x="0" y="0" width="34" height="25" rx="3"/><rect x="54" y="0" width="34" height="25" rx="3"/><rect x="27" y="50" width="34" height="25" rx="3"/>
      <path d="M 17 25 V 37 H 44 M 71 25 V 37 H 44 V 50"/>
    </g>
    <text x="150" y="374" class="layer-title" fill="#6547b6">Application</text>
    <text x="150" y="405" class="layer-title" fill="#6547b6">Orchestration</text>
    <text x="150" y="436" class="layer-subtitle">serial, inspectable flow</text>

    <rect x="365" y="343" width="495" height="124" rx="20" class="card" stroke="#d5caf0"/>
    <rect x="387" y="366" width="78" height="78" rx="18" fill="#f1ecff"/>
    <g class="icon" stroke="#6547b6" transform="translate(405 384)">
      <path d="M 5 20 A 17 17 0 0 1 35 10 L 40 7 M 40 7 V 17 M 39 27 A 17 17 0 0 1 9 37 L 4 40 M 4 40 V 30"/>
    </g>
    <text x="485" y="388" class="card-title">AgentLoop</text>
    <text x="485" y="419" class="card-body">serial model and Tool Activities</text>

    <rect x="880" y="343" width="495" height="124" rx="20" class="card" stroke="#d5caf0"/>
    <rect x="902" y="366" width="78" height="78" rx="18" fill="#f1ecff"/>
    <g class="icon" stroke="#6547b6" transform="translate(918 385)">
      <path d="M 3 10 L 24 0 L 45 10 L 24 20 Z M 3 23 L 24 33 L 45 23 M 3 34 L 24 44 L 45 34"/>
    </g>
    <text x="1000" y="388" class="card-title">ContextBuilder</text>
    <text x="1000" y="419" class="card-body">bounded committed Event history</text>

    <rect x="1395" y="343" width="505" height="124" rx="20" class="card" stroke="#d5caf0"/>
    <rect x="1417" y="366" width="78" height="78" rx="18" fill="#f1ecff"/>
    <g class="icon" stroke="#6547b6" transform="translate(1435 383)">
      <circle cx="19" cy="19" r="15"/><path d="M 30 30 L 43 43 M 19 12 V 26 M 12 19 H 26"/>
    </g>
    <text x="1515" y="388" class="card-title">RunQueryService</text>
    <text x="1515" y="419" class="card-body">reads Runs, Events, and Artifacts</text>
  </g>

  <path d="M 960 493 V 516" class="connector"/>

  <!-- Layer 3: Runtime core and safety -->
  <g>
    <rect x="20" y="525" width="1880" height="160" rx="24" fill="#effaf7" stroke="#c8e5dd" stroke-width="1.4"/>
    <path d="M 340 525 V 685" stroke="#c8e5dd" stroke-width="1.4"/>
    <rect x="20" y="525" width="320" height="160" rx="24" fill="#e4f5f0"/>

    <g class="icon" stroke="#158373" transform="translate(52 573)">
      <circle cx="42" cy="32" r="28"/><circle cx="42" cy="32" r="8"/>
      <path d="M 42 0 V 4 M 42 60 V 64 M 10 32 H 14 M 70 32 H 74"/>
    </g>
    <text x="150" y="574" class="layer-title" fill="#158373">Runtime Core</text>
    <text x="150" y="605" class="layer-title" fill="#158373">&amp; Safety</text>
    <text x="150" y="636" class="layer-subtitle">BearAgent types only</text>

    <rect x="365" y="543" width="495" height="124" rx="20" class="card" stroke="#c3e1d9"/>
    <rect x="387" y="566" width="78" height="78" rx="18" fill="#e8f7f3"/>
    <g class="icon" stroke="#158373" transform="translate(404 582)">
      <circle cx="8" cy="10" r="6"/><circle cx="36" cy="10" r="6"/><circle cx="22" cy="40" r="6"/>
      <path d="M 13 14 L 19 34 M 31 14 L 25 34 M 14 10 H 30"/>
    </g>
    <text x="485" y="588" class="card-title">Domain Contracts</text>
    <text x="485" y="619" class="card-body">Message · Event · ToolRequest · Artifact</text>

    <rect x="880" y="543" width="495" height="124" rx="20" class="card" stroke="#c3e1d9"/>
    <rect x="902" y="566" width="78" height="78" rx="18" fill="#e8f7f3"/>
    <g class="icon" stroke="#158373" transform="translate(918 583)">
      <path d="M 3 38 A 21 21 0 1 1 45 38 M 24 18 L 37 30"/><circle cx="24" cy="38" r="4"/>
    </g>
    <text x="1000" y="588" class="card-title">Reducer &amp; Hard Budgets</text>
    <text x="1000" y="619" class="card-body">pure state updates with five hard limits</text>

    <rect x="1395" y="543" width="505" height="124" rx="20" class="card" stroke="#c3e1d9"/>
    <rect x="1417" y="566" width="78" height="78" rx="18" fill="#e8f7f3"/>
    <g class="icon" stroke="#158373" transform="translate(1435 579)">
      <path d="M 22 1 L 41 9 V 25 C 41 37 33 45 22 50 C 11 45 3 37 3 25 V 9 Z"/>
      <path d="M 13 25 L 20 32 L 32 19"/>
    </g>
    <text x="1515" y="581" class="card-title">Controlled Tool Path</text>
    <g>
      <rect x="1515" y="608" width="78" height="31" rx="10" fill="#e7f6f2"/>
      <rect x="1606" y="608" width="78" height="31" rx="10" fill="#e7f6f2"/>
      <rect x="1697" y="608" width="78" height="31" rx="10" fill="#e7f6f2"/>
      <rect x="1788" y="608" width="86" height="31" rx="10" fill="#e7f6f2"/>
      <path d="M 1595 623.5 H 1604 M 1686 623.5 H 1695 M 1777 623.5 H 1786" stroke="#78a99f" stroke-width="2"/>
      <text x="1554" y="629" text-anchor="middle" class="chip">Registry</text>
      <text x="1645" y="629" text-anchor="middle" class="chip">prepare</text>
      <text x="1736" y="629" text-anchor="middle" class="chip">Policy</text>
      <text x="1831" y="629" text-anchor="middle" class="chip">Executor</text>
    </g>
  </g>

  <path d="M 960 693 V 716" class="connector"/>

  <!-- Layer 4: Ports and adapters -->
  <g>
    <rect x="20" y="725" width="1880" height="160" rx="24" fill="#fff8ef" stroke="#eed8bf" stroke-width="1.4"/>
    <path d="M 340 725 V 885" stroke="#eed8bf" stroke-width="1.4"/>
    <rect x="20" y="725" width="320" height="160" rx="24" fill="#fff0df"/>

    <g class="icon" stroke="#c9681f" transform="translate(50 773)">
      <rect x="0" y="8" width="34" height="28" rx="3"/><rect x="54" y="8" width="34" height="28" rx="3"/>
      <path d="M 34 22 H 54 M 17 0 V 8 M 71 36 V 46"/>
      <circle cx="17" cy="0" r="3" fill="#c9681f" stroke="none"/><circle cx="71" cy="48" r="3" fill="#c9681f" stroke="none"/>
    </g>
    <text x="150" y="774" class="layer-title" fill="#c9681f">Ports &amp;</text>
    <text x="150" y="805" class="layer-title" fill="#c9681f">Adapters</text>
    <text x="150" y="836" class="layer-subtitle">external translation edge</text>

    <rect x="365" y="743" width="495" height="124" rx="20" class="card" stroke="#ead2b8"/>
    <rect x="387" y="766" width="78" height="78" rx="18" fill="#fff3e5"/>
    <g class="icon" stroke="#c9681f" transform="translate(405 783)">
      <circle cx="21" cy="21" r="20"/><path d="M 21 9 V 33 M 9 21 H 33"/>
    </g>
    <text x="485" y="788" class="card-title">ModelProvider</text>
    <text x="485" y="819" class="card-body">three streaming protocol adapters</text>

    <rect x="880" y="743" width="495" height="124" rx="20" class="card" stroke="#ead2b8"/>
    <rect x="902" y="766" width="78" height="78" rx="18" fill="#fff3e5"/>
    <g class="icon" stroke="#c9681f" transform="translate(918 784)">
      <path d="M 2 11 H 20 L 27 18 H 46 V 41 H 2 Z"/>
    </g>
    <text x="1000" y="788" class="card-title">Workspace Tools</text>
    <text x="1000" y="819" class="card-body">bounded list · read · search · write</text>

    <rect x="1395" y="743" width="505" height="124" rx="20" class="card" stroke="#ead2b8"/>
    <rect x="1417" y="766" width="78" height="78" rx="18" fill="#fff3e5"/>
    <g class="icon" stroke="#c9681f" transform="translate(1435 779)">
      <ellipse cx="22" cy="8" rx="19" ry="7"/><path d="M 3 8 V 40 C 3 47 41 47 41 40 V 8"/><path d="M 3 24 C 3 31 41 31 41 24"/>
    </g>
    <text x="1515" y="788" class="card-title">EventStore</text>
    <text x="1515" y="819" class="card-body">SQLite WAL · atomic Event append</text>
  </g>

  <path d="M 960 893 V 916" class="connector"/>

  <!-- Layer 5: Facts and outputs -->
  <g>
    <rect x="20" y="925" width="1880" height="160" rx="24" fill="#eff8fb" stroke="#c8e1eb" stroke-width="1.4"/>
    <path d="M 340 925 V 1085" stroke="#c8e1eb" stroke-width="1.4"/>
    <rect x="20" y="925" width="320" height="160" rx="24" fill="#e6f3f8"/>

    <g class="icon" stroke="#26738f" transform="translate(52 973)">
      <ellipse cx="37" cy="8" rx="28" ry="8"/><path d="M 9 8 V 50 C 9 59 65 59 65 50 V 8"/><path d="M 9 29 C 9 38 65 38 65 29"/>
    </g>
    <text x="150" y="974" class="layer-title" fill="#26738f">Facts &amp;</text>
    <text x="150" y="1005" class="layer-title" fill="#26738f">Outputs</text>
    <text x="150" y="1036" class="layer-subtitle">durable local evidence</text>

    <rect x="365" y="943" width="495" height="124" rx="20" class="card" stroke="#c4dde7"/>
    <rect x="387" y="966" width="78" height="78" rx="18" fill="#e9f5f9"/>
    <g class="icon" stroke="#26738f" transform="translate(407 982)">
      <path d="M 3 2 H 34 L 43 11 V 45 H 3 Z M 34 2 V 11 H 43"/><path d="M 11 20 H 34 M 11 29 H 34 M 11 38 H 27"/>
    </g>
    <text x="485" y="988" class="card-title">Event Log</text>
    <text x="485" y="1019" class="card-body">append-only Events · source of truth</text>

    <rect x="880" y="943" width="495" height="124" rx="20" class="card" stroke="#c4dde7"/>
    <rect x="902" y="966" width="78" height="78" rx="18" fill="#e9f5f9"/>
    <g class="icon" stroke="#26738f" transform="translate(920 984)">
      <rect x="2" y="22" width="10" height="22" rx="2"/><rect x="18" y="12" width="10" height="32" rx="2"/><rect x="34" y="2" width="10" height="42" rx="2"/>
    </g>
    <text x="1000" y="988" class="card-title">Run Views</text>
    <text x="1000" y="1019" class="card-body">Run / Activity projections · rebuildable</text>

    <rect x="1395" y="943" width="505" height="124" rx="20" class="card" stroke="#c4dde7"/>
    <rect x="1417" y="966" width="78" height="78" rx="18" fill="#e9f5f9"/>
    <g class="icon" stroke="#26738f" transform="translate(1437 981)">
      <path d="M 3 3 H 31 L 43 15 V 45 H 3 Z M 31 3 V 15 H 43"/><circle cx="24" cy="31" r="8"/><path d="M 20 31 L 23 34 L 29 27"/>
    </g>
    <text x="1515" y="988" class="card-title">Workspace &amp; Artifacts</text>
    <text x="1515" y="1019" class="card-body">bounded files · atomic outputs/** writes</text>
  </g>

  <!-- Current boundary -->
  <rect x="20" y="1110" width="1880" height="64" rx="18" fill="#fff" stroke="#dfe6ee"/>
  <circle cx="52" cy="1142" r="6" fill="#26738f"/>
  <text x="72" y="1148" class="footer">Current boundary: single user · single Agent · single process · CLI + SQLite · no HTTP, MCP, Approval, sandbox, or automatic recovery.</text>
</svg>
